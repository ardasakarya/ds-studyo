name: GitHub Pages'e yayınla

# main'e her push'ta siteyi derleyip (out/) Pages'e gönderir.
# Repo ayarları → Pages → Source: "GitHub Actions" seçili olmalı.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Site kullanici.github.io/REPO altında yayınlanıyorsa tüm bağlantıların
      # başına /REPO gelmeli. Repo adı kullanici.github.io ise alt yol yok.
      - name: Alt yolu ve yayın adresini hesapla
        run: |
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [ "$REPO" = "$OWNER.github.io" ]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=https://$OWNER.github.io" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/$REPO" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=https://$OWNER.github.io/$REPO" >> "$GITHUB_ENV"
          fi

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
